name: release

# Publie une version, au choix :
# - en poussant un tag vX.Y.Z (sur un commit de main) ;
# - depuis GitHub : Actions → release → Run workflow sur main, avec le numéro X.Y.Z (le tag est créé).
# Compile l'exécutable et crée la Release GitHub avec le zip et son empreinte SHA256.
# Relancé pour une version déjà publiée, il met à jour les notes sans remplacer les fichiers.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version X.Y.Z (le tag vX.Y.Z est créé sur main)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SSH.NET 2026.0.0 patché (noms du propriétaire et du groupe en SFTP), compilé depuis le fork à un commit figé.
      - name: SSH.NET patché
        shell: bash
        run: bash tools/sshnet-patched.sh

      - name: Numéro de version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "Lancez la publication depuis main (et non $env:GITHUB_REF)." }
            $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          } else {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : '$version' (attendu X.Y.Z)" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV

      - name: Tests
        run: dotnet test ZillaTerm.sln -c Release

      - name: Publication (exe autonome win-x64)
        run: >
          dotnet publish src/ZillaTerm.App/ZillaTerm.App.csproj
          -c Release -r win-x64 -p:SelfContained=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Archive et empreinte
        shell: pwsh
        run: |
          $zip = "ZillaTerm-$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/ZillaTerm.exe, LICENSE -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:TAG.md"
          $files = @("ZillaTerm-$env:VERSION-win-x64.zip", "SHA256SUMS.txt")
          $existing = @(gh release list --limit 200 --json tagName | ConvertFrom-Json | ForEach-Object tagName)
          if ($existing -contains $env:TAG) {
            # Release déjà existante (créée depuis l'interface GitHub, ou relance pour corriger les notes) :
            # on joint seulement les fichiers absents, sans remplacer ceux déjà publiés, puis on met les notes à jour.
            $published = @(gh release view $env:TAG --json assets | ConvertFrom-Json | ForEach-Object { $_.assets.name })
            $missing = @($files | Where-Object { $published -notcontains $_ })
            if ($missing.Count -gt 0) { gh release upload $env:TAG @missing }
            if (Test-Path $notes) { gh release edit $env:TAG --notes-file $notes }
          } else {
            # Le tag est créé sur le commit compilé s'il n'existe pas encore.
            $options = @('--title', "ZillaTerm $env:VERSION", '--target', $env:GITHUB_SHA)
            if (Test-Path $notes) { $options += @('--notes-file', $notes) } else { $options += '--generate-notes' }
            gh release create $env:TAG @files @options
          }
