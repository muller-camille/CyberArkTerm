name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SSH.NET 2026.0.0 patché (noms du propriétaire et du groupe en SFTP), compilé depuis le fork à un commit figé.
      - name: SSH.NET patché
        shell: bash
        run: bash tools/sshnet-patched.sh

      - name: Tests
        run: dotnet test ZillaTerm.sln -c Release

      - name: Publication (exe autonome win-x64)
        run: >
          dotnet publish src/ZillaTerm.App/ZillaTerm.App.csproj
          -c Release -r win-x64 -p:SelfContained=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ZillaTerm-win-x64
          path: publish/ZillaTerm.exe
