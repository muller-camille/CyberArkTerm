    </g>
    <!-- Terminal -->
    <rect x="30" y="114" width="156" height="108" rx="18" fill="#252a33" stroke="#3b424e" stroke-width="5"/>
    <g fill="none" stroke="#5be49b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 146 L80 166 L58 186"/>
      <path d="M94 188 L124 188"/>
