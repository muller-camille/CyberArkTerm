    </g>
    <!-- Dents -->
    <g fill="#f4f1e6">
      <path d="M108 83 L116 83 L112 93 Z"/>
      <path d="M121 83 L129 83 L125 93 Z"/>
      <path d="M134 83 L142 83 L138 93 Z"/>
      <path d="M147 83 L155 83 L151 93 Z"/>
      <path d="M115 93 L123 93 L119 86 Z"/>
      <path d="M140 93 L148 93 L144 86 Z"/>
    </g>
    <!-- Griffes sur le bord du terminal -->
    <g fill="#f4f1e6">
      <path d="M117 121 L123 121 L120 129 Z"/>
      <path d="M126 122 L132 122 L129 130 Z"/>
      <path d="M143 121 L149 121 L146 129 Z"/>
