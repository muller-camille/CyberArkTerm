    <!-- Tête : gueule ouverte -->
    <rect x="100" y="78" width="76" height="20" rx="6" fill="#6b2230"/>
    <g fill="#4fc37f">
      <ellipse cx="180" cy="70" rx="46" ry="38"/>
      <rect x="92" y="48" width="106" height="36" rx="18"/>
